name: PCB CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KICAD_IMAGE: kicad/kicad:10.0.5-full
  SCH: pcb/compute-blade-dda-adapter.kicad_sch
  PCB: pcb/compute-blade-dda-adapter.kicad_pcb

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and authenticate official mechanical reference CAD
        run: |
          python3 scripts/fetch_reference_cad.py | tee output/reference-cad.txt

      - name: Install pinned assembly CAD toolchain
        run: python3 -m pip install --requirement requirements-assembly.txt

      - name: Verify deterministic generation and measured-geometry tests
        run: |
          python3 scripts/generate_schematic.py
          python3 scripts/generate_or_update_pcb.py
          python3 scripts/generate_mechanical_model.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          git diff --exit-code -- pcb CONNECTIVITY.txt mechanical/generated

      - name: Verify exact physical-pin connectivity
        run: python3 scripts/verify_connectivity.py | tee output/connectivity-report.txt

      - name: Validate connector constraints and conservative assembly geometry
        run: python3 scripts/validate_geometry.py --compare-variants | tee output/geometry-report.txt

      - name: Generate and verify inspectable 3D assembly
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_CACHE_HOME: /tmp/assembly-cache
        run: |
          xvfb-run -a python3 scripts/generate_assembly_model.py
          test -s mechanical/generated/full_assembly.step
          test -s mechanical/generated/full_assembly_with_bladerunner.step
          test -s mechanical/generated/render_top.png
          test -s mechanical/generated/render_side.png
          test -s mechanical/generated/render_front.png
          test -s mechanical/generated/render_iso.png
          test -s mechanical/generated/render_j1_closeup.png
          test -s mechanical/generated/render_j2_closeup.png

      - name: Pull pinned KiCad CLI image
        run: docker pull "$KICAD_IMAGE"

      - name: Record KiCad version
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli version | tee output/kicad-version.txt

      - name: Run schematic ERC
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli sch erc \
            --severity-error --severity-warning --exit-code-violations \
            -o output/erc.rpt "$SCH"

      - name: Run PCB DRC
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb drc \
            --severity-error --severity-warning \
            -o output/drc.rpt "$PCB"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb drc \
            --severity-error --exit-code-violations \
            -o output/drc-errors.rpt "$PCB"

      - name: Export schematic and board views
        run: |
          mkdir -p output/views
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli sch export pdf \
            --black-and-white -o output/views/schematic.pdf "$SCH"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb export svg \
            --mode-single --fit-page-to-board --exclude-drawing-sheet \
            --layers F.Cu,F.SilkS,Edge.Cuts \
            -o output/views/board-front.svg "$PCB"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb export svg \
            --mode-single --fit-page-to-board --exclude-drawing-sheet --mirror \
            --layers B.Cu,B.SilkS,Edge.Cuts \
            -o output/views/board-back.svg "$PCB"
          cp mechanical/generated/assembly_side_default.svg output/views/
          cp mechanical/generated/assembly_side_rot180.svg output/views/

      - name: Export Gerbers and Excellon drill files
        run: |
          mkdir -p output/gerbers
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb export gerbers \
            --layers F.Cu,B.Cu,F.Mask,B.Mask,F.SilkS,B.SilkS,Edge.Cuts \
            --output output/gerbers "$PCB"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/kicad-home -v "$PWD:/work" -w /work \
            "$KICAD_IMAGE" kicad-cli pcb export drill \
            --format excellon --excellon-units mm --generate-map \
            --map-format pdf --generate-report \
            --report-path output/drill-report.rpt \
            --output output/gerbers "$PCB"
          test -n "$(find output/gerbers -maxdepth 1 -type f -print -quit)"

      - name: Package manufacturing files
        working-directory: output/gerbers
        run: zip -9 ../compute-blade-dda-adapter-gerbers.zip ./*

      - name: Upload manufacturing artifact
        uses: actions/upload-artifact@v4
        with:
          name: compute-blade-dda-adapter-manufacturing
          path: output/compute-blade-dda-adapter-gerbers.zip
          if-no-files-found: error

      - name: Upload reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-blade-dda-adapter-reports
          path: |
            output/*.txt
            output/*.rpt
            output/views/
            mechanical/generated/*.json
            mechanical/generated/*.step
            mechanical/generated/*.stl
            mechanical/generated/*.png
          if-no-files-found: warn
